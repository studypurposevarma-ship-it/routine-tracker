<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Routine & Habit Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#090d16',
                        cardbg: '#131c31',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-darker/80 backdrop-blur sticky top-0 z-50 px-4 py-3 sm:px-8 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md shadow-indigo-500/20">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white">Daily Routine Tracker</h1>
                <p class="text-xs text-slate-400">Track habits, daily logs, and consistency</p>
            </div>
        </div>

        <!-- Quick Stats / Actions -->
        <div class="flex items-center space-x-4">
            <div class="hidden sm:flex flex-col items-end">
                <span id="streak-counter" class="text-sm font-semibold text-indigo-400">🔥 0 Day Streak</span>
                <span id="completion-rate" class="text-xs text-slate-400">Today: 0% Completed</span>
            </div>
            <button onclick="resetCurrentDay()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">Reset Day</button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-y-auto">
        
        <!-- Left 2 Columns: Date Selector, Habits & Notes -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Calendar & Date Navigation Bar -->
            <section class="bg-cardbg border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                    <button onclick="changeDate(-1)" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition text-slate-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div class="text-center">
                        <h2 id="current-date-display" class="text-base font-bold text-white">Loading Date...</h2>
                        <span id="day-name-display" class="text-xs text-indigo-400 font-medium"></span>
                    </div>
                    <button onclick="changeDate(1)" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition text-slate-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
                
                <div class="flex items-center space-x-2 w-full sm:w-auto">
                    <input type="date" id="date-picker" onchange="selectDateFromPicker(this.value)" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 w-full sm:w-auto">
                    <button onclick="goToToday()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20 whitespace-nowrap">Today</button>
                </div>
            </section>

            <!-- Daily Habits Section -->
            <section class="bg-cardbg border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-base font-semibold text-white flex items-center space-x-2">
                        <span>✨ Daily Routine & Habits</span>
                    </h3>
                    <button onclick="openAddHabitModal()" class="text-xs bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 px-3 py-1.5 rounded-lg transition">+ Add Habit</button>
                </div>

                <!-- Habits Checklist Container -->
                <div id="habits-container" class="space-y-3">
                    <!-- Dynamically Injected Habits -->
                </div>
            </section>

            <!-- Daily Notes / Reflections Section -->
            <section class="bg-cardbg border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-3">
                <h3 class="text-base font-semibold text-white flex items-center space-x-2">
                    <span>📝 Daily Notes & Reflection</span>
                </h3>
                <textarea id="daily-notes" oninput="saveNotes(this.value)" rows="4" placeholder="How was your day? What did you accomplish or learn today? (Saved automatically)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
            </section>
        </div>

        <!-- Right Column: Calendar View & Management -->
        <div class="space-y-6">
            <!-- Monthly Mini-Calendar View -->
            <section class="bg-cardbg border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 id="cal-month-year" class="text-base font-semibold text-white">Month Year</h3>
                    <div class="flex space-x-1">
                        <button onclick="changeMonth(-1)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300">&lt;</button>
                        <button onclick="changeMonth(1)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300">&gt;</button>
                    </div>
                </div>

                <!-- Days Header -->
                <div class="grid grid-cols-7 text-center text-xs font-medium text-slate-400">
                    <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
                </div>

                <!-- Calendar Grid -->
                <div id="mini-calendar-grid" class="grid grid-cols-7 gap-1.5 text-center text-sm">
                    <!-- Injected calendar days -->
                </div>
            </section>

            <!-- Manage Habit Items -->
            <section class="bg-cardbg border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-3">
                <h3 class="text-base font-semibold text-white">⚙️ Manage Habit List</h3>
                <p class="text-xs text-slate-400">Add or remove global habits tracked across your days.</p>
                <div id="habit-management-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- Habit manager rows -->
                </div>
            </section>
        </div>
    </main>

    <!-- Add Habit Modal -->
    <div id="habit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-white">Add New Habit</h3>
            <input type="text" id="new-habit-name" placeholder="e.g., Morning Meditation (30 mins)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end space-x-3">
                <button onclick="closeAddHabitModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-xl font-medium transition">Cancel</button>
                <button onclick="confirmAddHabit()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs rounded-xl font-medium transition">Add</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        let currentDate = new Date();
        let currentMonthView = new Date();

        // Default habits if none exist in localStorage
        const defaultHabits = [
            { id: 'h1', name: 'Early Wake Up (6:00 AM)' },
            { id: 'h2', name: 'Workout / Physical Exercise' },
            { id: 'h3', name: 'Deep Study / Skill Practice' },
            { id: 'h4', name: 'Read 10 Pages of a Book' },
            { id: 'h5', name: 'Zero Social Media Slacking' }
        ];

        function getStoredHabits() {
            const stored = localStorage.getItem('routine_habits');
            if (!stored) {
                localStorage.setItem('routine_habits', JSON.stringify(defaultHabits));
                return defaultHabits;
            }
            return JSON.parse(stored);
        }

        function saveStoredHabits(habits) {
            localStorage.setItem('routine_habits', JSON.stringify(habits));
        }

        function getDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDayData(dateKey) {
            const stored = localStorage.getItem(`routine_data_${dateKey}`);
            if (!stored) {
                return { completedHabits: {}, notes: '' };
            }
            return JSON.parse(stored);
        }

        function saveDayData(dateKey, data) {
            localStorage.setItem(`routine_data_${dateKey}`, JSON.stringify(data));
        }

        // Initialize App
        function initApp() {
            renderHeaderDate();
            renderHabits();
            renderNotes();
            renderMiniCalendar();
            updateStreakAndStats();
        }

        function renderHeaderDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date-display').innerText = currentDate.toLocaleDateString('en-US', options);
            document.getElementById('day-name-display').innerText = isToday(currentDate) ? '⭐ Today' : '';
            document.getElementById('date-picker').value = getDateKey(currentDate);
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function changeDate(days) {
            currentDate.setDate(currentDate.getDate() + days);
            initApp();
        }

        function selectDateFromPicker(dateString) {
            if (!dateString) return;
            const parts = dateString.split('-');
            currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
            initApp();
        }

        function goToToday() {
            currentDate = new Date();
            initApp();
        }

        // Habit Rendering & Interaction
        function renderHabits() {
            const habits = getStoredHabits();
            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);
            const container = document.getElementById('habits-container');
            const managementList = document.getElementById('habit-management-list');
            
            container.innerHTML = '';
            managementList.innerHTML = '';

            if (habits.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No habits added yet. Click "+ Add Habit" above.</p>`;
            }

            habits.forEach(habit => {
                const isChecked = dayData.completedHabits[habit.id] || false;

                // Main Checklist Card
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-3.5 rounded-xl border transition ${isChecked ? 'bg-indigo-950/30 border-indigo-500/40 text-indigo-200' : 'bg-slate-900/50 border-slate-800 text-slate-300'}`;
                item.innerHTML = `
                    <label class="flex items-center space-x-3 cursor-pointer flex-1 select-none">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleHabit('${habit.id}')" class="w-5 h-5 accent-indigo-600 rounded bg-slate-900 border-slate-700 cursor-pointer">
                        <span class="text-sm font-medium ${isChecked ? 'line-through text-slate-400' : ''}">${habit.name}</span>
                    </label>
                `;
                container.appendChild(item);

                // Management Row
                const mgmtItem = document.createElement('div');
                mgmtItem.className = 'flex items-center justify-between bg-slate-900/80 px-3 py-2 rounded-lg border border-slate-800 text-xs';
                mgmtItem.innerHTML = `
                    <span class="text-slate-300 truncate mr-2">${habit.name}</span>
                    <button onclick="deleteHabit('${habit.id}')" class="text-rose-400 hover:text-rose-300 font-semibold px-2 py-1">Delete</button>
                `;
                managementList.appendChild(mgmtItem);
            });

            updateCompletionRate(dayData, habits);
        }

        function toggleHabit(habitId) {
            const dateKey = getDateKey(currentDate);
            let dayData = getDayData(dateKey);
            dayData.completedHabits[habitId] = !dayData.completedHabits[habitId];
            saveDayData(dateKey, dayData);
            renderHabits();
            renderMiniCalendar();
            updateStreakAndStats();
        }

        function renderNotes() {
            const dateKey = getDateKey(currentDate);
            const dayData = getDayData(dateKey);
            document.getElementById('daily-notes').value = dayData.notes || '';
        }

        function saveNotes(text) {
            const dateKey = getDateKey(currentDate);
            let dayData = getDayData(dateKey);
            dayData.notes = text;
            saveDayData(dateKey, dayData);
        }

        function resetCurrentDay() {
            if (confirm("Are you sure you want to reset completions for this date?")) {
                const dateKey = getDateKey(currentDate);
                let dayData = getDayData(dateKey);
                dayData.completedHabits = {};
                saveDayData(dateKey, dayData);
                initApp();
            }
        }

        // Habit CRUD Modals
        function openAddHabitModal() {
            document.getElementById('new-habit-name').value = '';
            document.getElementById('habit-modal').classList.remove('hidden');
            document.getElementById('habit-modal').classList.add('flex');
        }

        function closeAddHabitModal() {
            document.getElementById('habit-modal').classList.remove('flex');
            document.getElementById('habit-modal').classList.add('hidden');
        }

        function confirmAddHabit() {
            const name = document.getElementById('new-habit-name').value.trim();
            if (!name) return;
            const habits = getStoredHabits();
            habits.push({ id: 'h_' + Date.now(), name: name });
            saveStoredHabits(habits);
            closeAddHabitModal();
            renderHabits();
        }

        function deleteHabit(habitId) {
            let habits = getStoredHabits();
            habits = habits.filter(h => h.id !== habitId);
            saveStoredHabits(habits);
            renderHabits();
            renderMiniCalendar();
        }

        // Mini Calendar & Stats
        function changeMonth(delta) {
            currentMonthView.setMonth(currentMonthView.getMonth() + delta);
            renderMiniCalendar();
        }

        function renderMiniCalendar() {
            const grid = document.getElementById('mini-calendar-grid');
            const monthYearTitle = document.getElementById('cal-month-year');
            grid.innerHTML = '';

            const year = currentMonthView.getFullYear();
            const month = currentMonthView.getMonth();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthYearTitle.innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const habits = getStoredHabits();

            // Blank spaces for previous month offset
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                grid.appendChild(emptyCell);
            }

            // Days of month
            for (let day = 1; day <= totalDays; day++) {
                const dateObj = new Date(year, month, day);
                const dateKey = getDateKey(dateObj);
                const dayData = getDayData(dateKey);

                // Calculate progress dot color
                let completedCount = 0;
                habits.forEach(h => { if (dayData.completedHabits[h.id]) completedCount++; });
                
                let dotColor = 'bg-slate-800';
                if (habits.length > 0 && completedCount === habits.length) {
                    dotColor = 'bg-emerald-500 text-white font-bold';
                } else if (completedCount > 0) {
                    dotColor = 'bg-indigo-600/60 text-indigo-200';
                }

                const isSelected = getDateKey(currentDate) === dateKey;
                const isCurrentToday = isToday(dateObj);

                const cell = document.createElement('button');
                cell.onclick = () => { currentDate = dateObj; initApp(); };
                cell.className = `h-8 w-8 mx-auto flex items-center justify-center rounded-lg text-xs transition ${dotColor} ${isSelected ? 'ring-2 ring-white' : ''} ${isCurrentToday && !isSelected ? 'border border-indigo-400' : ''} hover:opacity-80`;
                cell.innerText = day;
                grid.appendChild(cell);
            }
        }

        function updateCompletionRate(dayData, habits) {
            const rateDisplay = document.getElementById('completion-rate');
            if (habits.length === 0) {
                rateDisplay.innerText = 'Today: 0% Completed';
                return;
            }
            let completed = 0;
            habits.forEach(h => { if (dayData.completedHabits[h.id]) completed++; });
            const percentage = Math.round((completed / habits.length) * 100);
            rateDisplay.innerText = `Today: ${percentage}% Completed (${completed}/${habits.length})`;
        }

        function updateStreakAndStats() {
            // Simple streak computation backwards from today
            let streak = 0;
            let checkDate = new Date();
            const habits = getStoredHabits();

            while (true) {
                const dateKey = getDateKey(checkDate);
                const dayData = getDayData(dateKey);
                if (habits.length === 0) break;

                let completed = 0;
                habits.forEach(h => { if (dayData.completedHabits[h.id]) completed++; });

                // Count streak if all habits were finished, or if it's today and at least started
                if (completed === habits.length) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    // If today isn't finished yet, don't break streak immediately, check yesterday
                    if (isToday(checkDate)) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        continue;
                    }
                    break;
                }
            }
            document.getElementById('streak-counter').innerText = `🔥 ${streak} Day Streak`;
        }

        // Run on load
        window.onload = initApp;
    </script>
</body>
</html>
